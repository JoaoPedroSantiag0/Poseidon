# Gitleaks Configuration for Poseidon Project
title = "Poseidon Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for false positives and non-sensitive fixtures"
paths = [
    '''(?i)^\.git/''',
    '''(?i)^\.remember/''',
    '''(?i)tests/fixtures/''',
    '''(?i)docs/gates/TEMPLATE/''',
    '''(?i)docs/adr/TEMPLATE\.md'''
]
regexes = [
    '''(?i)EXAMPLE[_-]?KEY''',
    '''(?i)YOUR[_-]?API[_-]?KEY''',
    '''(?i)ACT-2026-000183'''
]
