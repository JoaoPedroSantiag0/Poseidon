# ==============================================================================
# POSEIDON CTI Platform — Turnkey Production Orchestration
# Conforming to Prompt 01 (Architecture), Prompt 02 (UX), Prompt 03 (DevSecOps)
# Usage: docker compose -f docker-compose.prod.yml up -d
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Database Storage Engine (PostgreSQL 16 Alpine)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: poseidon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poseidon_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-PoseidonSec2026!Db}
      POSTGRES_DB: ${POSTGRES_DB:-poseidon}
    volumes:
      - poseidon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poseidon_admin} -d ${POSTGRES_DB:-poseidon}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - poseidon_internal

  # ----------------------------------------------------------------------------
  # 2. In-Memory Cache & Distributed Lock Broker (Redis 7 Alpine)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: poseidon-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-PoseidonRedis2026!Lock}", "--appendonly", "yes"]
    volumes:
      - poseidon_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-PoseidonRedis2026!Lock}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - poseidon_internal

  # ----------------------------------------------------------------------------
  # 3. Core CTI Engine, TAXII 2.1 Server & AI Analyst API (FastAPI Multi-Worker)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: poseidon-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSEIDON_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-poseidon_admin}:${POSTGRES_PASSWORD:-PoseidonSec2026!Db}@postgres:5432/${POSTGRES_DB:-poseidon}
      REDIS_URL: redis://:${REDIS_PASSWORD:-PoseidonRedis2026!Lock}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-poseidon_production_secret_key_minimum_32_bytes_long_2026}
      TAXII_SERVER_TITLE: ${TAXII_SERVER_TITLE:-POSEIDON TAXII 2.1 Server}
      TAXII_SERVER_DESCRIPTION: ${TAXII_SERVER_DESCRIPTION:-Enterprise Cyber Threat Intelligence Exchange Node}
      TAXII_SERVER_CONTACT: ${TAXII_SERVER_CONTACT:-soc-cti@poseidon.sec}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      CENSYS_API_KEY: ${CENSYS_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      GREYNOISE_API_KEY: ${GREYNOISE_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      MISP_DEFAULT_URL: ${MISP_DEFAULT_URL:-}
      MISP_DEFAULT_API_KEY: ${MISP_DEFAULT_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@poseidon.sec}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-PoseidonRoot2026!Secure}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - poseidon_internal

  # ----------------------------------------------------------------------------
  # 4. SOC Console Frontend (Vite React 19 SPA on Alpine Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: poseidon-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - poseidon_internal

  # ----------------------------------------------------------------------------
  # 5. Hardened Reverse Proxy & Edge Gateway (Nginx 1.27)
  # ----------------------------------------------------------------------------
  gateway:
    image: nginx:1.27-alpine
    container_name: poseidon-gateway
    restart: unless-stopped
    ports:
      - "${POSEIDON_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - poseidon_internal

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  poseidon_postgres_data:
    name: poseidon_postgres_data
  poseidon_redis_data:
    name: poseidon_redis_data

# ------------------------------------------------------------------------------
# Isolated Internal Network
# ------------------------------------------------------------------------------
networks:
  poseidon_internal:
    name: poseidon_internal
    driver: bridge
